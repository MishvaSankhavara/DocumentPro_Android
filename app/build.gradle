android {
    namespace 'com.arkay.gkinhindi'
    compileSdk 36

    //Started Ads implementation

    defaultConfig {
        applicationId "com.arkay.gkinhindi"
        minSdk 24
        targetSdk 36
        versionCode 203
        versionName "203.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        manifestPlaceholders = [admob_app_id: "ca-app-pub-3940256099942544~3347511713"]

        buildConfigField "String", "native_onboarding", "\"ca-app-pub-3940256099942544/2247696110\""
        buildConfigField "String", "native_onboarding_2ID", "\"ca-app-pub-3940256099942544/2247696110\""
        buildConfigField "String", "native_home", "\"ca-app-pub-3940256099942544/2247696110\""
        buildConfigField "String", "native_home_2ID", "\"ca-app-pub-3940256099942544/2247696110\""
        buildConfigField "String", "banner_splash", "\"ca-app-pub-3940256099942544/6300978111\""
        buildConfigField "String", "banner_splash_2ID", "\"ca-app-pub-3940256099942544/6300978111\""
    }

    flavorDimensions = ["env"]
    productFlavors {
        appDev {
            dimension "env"

            manifestPlaceholders = [admob_app_id: "ca-app-pub-3940256099942544~3347511713"]

            buildConfigField "String", "native_onboarding", "\"ca-app-pub-3940256099942544/2247696110\""
            buildConfigField "String", "native_onboarding_2ID", "\"ca-app-pub-3940256099942544/2247696110\""
            buildConfigField "String", "native_home", "\"ca-app-pub-3940256099942544/2247696110\""
            buildConfigField "String", "native_home_2ID", "\"ca-app-pub-3940256099942544/2247696110\""
            buildConfigField "String", "banner_splash", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "banner_splash_2ID", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "interstitial_splash", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "interstitial_splash_2ID", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "interstitial_function", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "interstitial_function_2ID", "\"ca-app-pub-3940256099942544/1033173712\""
        }
        appProd {
            dimension "env"

            manifestPlaceholders = [admob_app_id: "ca-app-pub-3940256099942544~3347511713"]

            buildConfigField "String", "native_onboarding", "\"ca-app-pub-3940256099942544/2247696110\""
            buildConfigField "String", "native_onboarding_2ID", "\"ca-app-pub-3940256099942544/2247696110\""
            buildConfigField "String", "native_home", "\"ca-app-pub-3940256099942544/2247696110\""
            buildConfigField "String", "native_home_2ID", "\"ca-app-pub-3940256099942544/2247696110\""
            buildConfigField "String", "banner_splash", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "banner_splash_2ID", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "interstitial_splash", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "interstitial_splash_2ID", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "interstitial_function", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "interstitial_function_2ID", "\"ca-app-pub-3940256099942544/1033173712\""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            crunchPngs false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ["libs"]
            jni.srcDirs = []

        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }
    buildFeatures {
        buildConfig = true
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

